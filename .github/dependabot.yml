version: 2
# Grouped weekly updates. Grouping keeps the SHA pins and the uv lockfile fresh
# in a small number of PRs rather than one-per-bump. The cooldown holds back
# releases younger than 7 days, matching [tool.uv] exclude-newer in pyproject.
updates:
  # GitHub Actions across all workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
