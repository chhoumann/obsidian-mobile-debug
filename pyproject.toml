[project]
name = "obsidian-mobile-debug"
version = "0.2.0"
description = "Debug Obsidian WebViews on iPhone, Android devices, emulators, and test containers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Christian B. B. Houmann", email = "christian@bagerbach.com" }]
keywords = ["obsidian", "ios", "android", "webview", "debugging", "pymobiledevice3", "cdp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "pymobiledevice3>=11",
    "websockets>=17",
]

[dependency-groups]
dev = ["pytest>=9"]

[project.urls]
Homepage = "https://github.com/chhoumann/obsidian-mobile-debug"
Repository = "https://github.com/chhoumann/obsidian-mobile-debug"

[project.scripts]
omd = "obsidian_mobile_debug.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mobile_debug"]

[tool.uv]
exclude-newer = "7 days"
# GHSA-6q48-6c7w-9gw2 (compromised emSign intermediates) is fixed in
# certifi 2026.10.19, which is younger than the 7-day window. Drop the
# per-package date once the window covers it; the constraint keeps the floor.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.pytest.ini_options]
testpaths = ["tests"]
